name: Build PersisOS

on:
  push:
    branches: [main]
    paths:
      - "PersisOS-2.0-*.json"
      - "build.py"
      - "hooks/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "PersisOS-2.0-*.json"
      - "build.py"
      - "hooks/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/image.yml
    with:
      config: PersisOS-2.0-${{ matrix.arch }}.json
      runner: ${{ matrix.runner }}
      artifact: persisos-${{ matrix.arch }}
