name: Build PersisOS Server

on:
  push:
    branches: [main]
    paths:
      - "PersisOS-Server-2.0-amd64.json"
      - "build.py"
      - "hooks/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "PersisOS-Server-2.0-amd64.json"
      - "build.py"
      - "hooks/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/image.yml
    with:
      config: PersisOS-Server-2.0-amd64.json
      runner: ubuntu-latest
      artifact: persisos-server-amd64
