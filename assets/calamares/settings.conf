---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - displaymanager
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: PersisOS
prompt-install: true
dont-chroot: false
oem-setup: false
