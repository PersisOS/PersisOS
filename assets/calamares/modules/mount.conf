---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# Keep Btrfs root on the top-level filesystem. Calamares' default @ subvolume
# layout has triggered grub-probe failures on Debian Trixie.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: ""

btrfsSwapSubvol: /@swap

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, compress=zstd:1 ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
